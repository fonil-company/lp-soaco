# Template: ${CRM_WEBHOOK_URL} é preenchido pela variável de ambiente ao subir o container.

# Limite de envios de lead por IP (anti-spam)
limit_req_zone $binary_remote_addr zone=leads:10m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # IP real do visitante atrás do proxy do Easypanel (Traefik)
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Lead do formulário -> webhook do CRM (token só existe no servidor)
    location = /api/lead {
        limit_except POST { deny all; }
        limit_req zone=leads burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;

        resolver 127.0.0.11 1.1.1.1 valid=60s ipv6=off;
        resolver_timeout 5s;
        set $crm_url "${CRM_WEBHOOK_URL}";
        proxy_pass $crm_url;
        proxy_ssl_server_name on;
        proxy_set_header Content-Type "application/json";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # Imagens: cache de 30 dias
    location ~* \.(webp|png|jpe?g|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    # Página: sempre revalida, para atualizações aparecerem na hora
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
